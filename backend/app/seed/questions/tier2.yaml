  - {slug: dv-e1, skill: data-visualization, topic: Chart choice, type: mcq_single, difficulty: easy,
     prompt: "Which chart best shows how monthly revenue changed over two years?",
     options: [{id: a, text: "Line chart"}, {id: b, text: "Pie chart"}, {id: c, text: "Scatter plot of two unrelated variables"}, {id: d, text: "Word cloud"}],
     answer: a, explanation: "Line charts show trends over a continuous time axis."}
  - {slug: dv-e2, skill: data-visualization, topic: Chart choice, type: mcq_single, difficulty: easy,
     prompt: "You want to compare sales across 8 product categories. Which chart is clearest?",
     options: [{id: a, text: "A sorted bar chart"}, {id: b, text: "A 3D pie chart"}, {id: c, text: "A line chart"}, {id: d, text: "A radar chart"}],
     answer: a, explanation: "Bars on a common baseline make comparisons easy; sorting helps ranking."}
  - {slug: dv-m1, skill: data-visualization, topic: Honest charts, type: mcq_single, difficulty: medium,
     prompt: "A bar chart's y-axis starts at 95 instead of 0, making a change from 96 to 98 look huge. What's the problem?",
     options: [{id: a, text: "Truncated axis exaggerates differences; bar charts should start at zero"}, {id: b, text: "Bars should be red"}, {id: c, text: "Nothing — it's more readable"}, {id: d, text: "It needs a legend"}],
     answer: a, explanation: "Bar length encodes value, so a non-zero baseline distorts the comparison."}
  - slug: dv-m-sa1
    skill: data-visualization
    topic: Dashboard design
    type: short_answer
    difficulty: medium
    prompt: What makes a dashboard useful to a business team? Name three design principles.
    reference_answer: A useful dashboard answers specific questions for a specific audience, putting the most important metrics first. It uses the right chart for each comparison, keeps colours meaningful and consistent (highlighting what needs attention), labels axes and units clearly, gives context such as targets or previous periods, avoids clutter and decoration, and lets users drill down or filter where needed.
    key_points:
      - {id: kp1, text: "Designed around audience questions with key metrics first", weight: 0.35}
      - {id: kp2, text: "Appropriate chart types, clear labels/units, minimal clutter", weight: 0.35}
      - {id: kp3, text: "Context (targets, comparisons) or purposeful colour/filters", weight: 0.3}
    explanation: Dashboards exist to support decisions, not to show every number.
  - {slug: dv-h1, skill: data-visualization, topic: Distributions, type: mcq_single, difficulty: hard,
     prompt: "Which chart best compares the distribution of delivery times across 5 cities, including outliers?",
     options: [{id: a, text: "Box plots (or violin plots) per city"}, {id: b, text: "A pie chart per city"}, {id: c, text: "A single line chart"}, {id: d, text: "A table of averages"}],
     answer: a, explanation: "Box plots show median, spread and outliers side by side; averages hide distribution shape."}
  - {slug: dv-h2, skill: data-visualization, topic: Accessibility, type: mcq_single, difficulty: hard,
     prompt: "How can you make a chart readable for people with red–green colour blindness?",
     options: [{id: a, text: "Use a colour-blind-safe palette and add direct labels or patterns so colour isn't the only cue"}, {id: b, text: "Use only red and green"}, {id: c, text: "Remove the legend"}, {id: d, text: "Make the chart smaller"}],
     answer: a, explanation: "Never rely on colour alone; labels, shapes and safe palettes keep meaning accessible."}
  # ---------------- data-cleaning
  - {slug: dc-e1, skill: data-cleaning, topic: Duplicates, type: mcq_single, difficulty: easy,
     prompt: "A customer list has the same email appearing several times with slightly different name spellings. What's a sensible first step?",
     options: [{id: a, text: "Normalise the email (trim, lowercase) and deduplicate on it, reviewing conflicting fields"}, {id: b, text: "Delete all rows"}, {id: c, text: "Keep duplicates — more data is better"}, {id: d, text: "Sort by name"}],
     answer: a, explanation: "Normalising a reliable key before deduplicating catches near-duplicates."}
  - {slug: dc-e2, skill: data-cleaning, topic: Data types, type: mcq_single, difficulty: easy,
     prompt: "A 'price' column contains values like '₹1,299'. What must you do before summing it?",
     options: [{id: a, text: "Strip the currency symbol and commas and convert to a numeric type"}, {id: b, text: "Nothing"}, {id: c, text: "Convert it to a date"}, {id: d, text: "Sort it alphabetically"}],
     answer: a, explanation: "Text-formatted numbers must be parsed into numbers before arithmetic."}
  - {slug: dc-m1, skill: data-cleaning, topic: Missing values, type: mcq_single, difficulty: medium,
     prompt: "20% of 'income' values are missing, mostly for younger customers. Why is filling them with the overall mean risky?",
     options: [{id: a, text: "Missingness isn't random here, so the mean biases young customers' incomes upward and hides the pattern"}, {id: b, text: "The mean can't be computed"}, {id: c, text: "It makes the file larger"}, {id: d, text: "There is no risk"}],
     answer: a, explanation: "When data is missing systematically, simple imputation distorts results; consider group-wise imputation, flags or modelling."}
  - slug: dc-m-sa1
    skill: data-cleaning
    topic: Outliers
    type: short_answer
    difficulty: medium
    prompt: How would you decide whether to remove an outlier from a dataset?
    reference_answer: First check whether it's an error — a typo, unit mistake, duplicate or impossible value such as an age of 250 — by tracing it to the source; errors should be corrected or removed. If it's a genuine but extreme value, it carries real information, so keep it and use robust statistics such as the median, analyse with and without it, or report it separately. Always document the rule used.
    key_points:
      - {id: kp1, text: "Investigate whether it's a data error vs a genuine value", weight: 0.4}
      - {id: kp2, text: "Fix/remove errors; keep genuine values (robust stats or sensitivity analysis)", weight: 0.35}
      - {id: kp3, text: "Document the decision/rule", weight: 0.25}
    explanation: Outliers are not automatically mistakes.
