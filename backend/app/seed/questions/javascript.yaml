defaults: {skill: javascript, purpose: any, source_type: curated_general, authoring: ai_assisted, bank_version: v1}
questions:
  - slug: js-e1
    topic: Equality
    type: code_output
    difficulty: easy
    prompt: |
      What does this log?
      ```js
      console.log(0 == "0", 0 === "0");
      ```
    options: [{id: a, text: "true true"}, {id: b, text: "true false"}, {id: c, text: "false true"}, {id: d, text: "false false"}]
    answer: b
    explanation: "== converts types before comparing, so 0 == '0' is true; === also compares types, so it is false."
  - slug: js-e2
    topic: Variables
    type: mcq_single
    difficulty: easy
    prompt: Which declaration creates a block-scoped variable that cannot be reassigned?
    options: [{id: a, text: var}, {id: b, text: let}, {id: c, text: const}, {id: d, text: function}]
    answer: c
    explanation: const is block-scoped and cannot be reassigned (though an object it points to can still be mutated).
  - slug: js-e3
    topic: Arrays
    type: code_output
    difficulty: easy
    prompt: |
      What does this log?
      ```js
      const a = [1, 2, 3].map(x => x * 2).filter(x => x > 2);
      console.log(a);
      ```
    options: [{id: a, text: "[2, 4, 6]"}, {id: b, text: "[4, 6]"}, {id: c, text: "[3]"}, {id: d, text: "[2]"}]
    answer: b
