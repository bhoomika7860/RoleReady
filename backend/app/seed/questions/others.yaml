  - slug: tst-m-sa1
    skill: testing
    topic: Test design
    type: short_answer
    difficulty: medium
    prompt: What test cases would you write for a function that validates a user's age is between 18 and 60 inclusive?
    reference_answer: Test typical valid values such as 30, the boundaries 18 and 60 which should pass, just outside the boundaries 17 and 61 which should fail, and invalid inputs such as negative numbers, zero, non-integers, null or missing values and strings if the type allows. Boundary value analysis and equivalence partitioning cover the space with few tests.
    key_points:
      - {id: kp1, text: "Boundary values (18, 60) and just outside (17, 61)", weight: 0.45}
      - {id: kp2, text: "A typical valid value", weight: 0.2}
      - {id: kp3, text: "Invalid input types / null / negative values", weight: 0.35}
    explanation: Boundaries are where off-by-one bugs live.
