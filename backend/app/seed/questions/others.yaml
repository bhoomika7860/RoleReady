  - slug: sec-m-sa1
    skill: auth-security
    topic: XSS
    type: short_answer
    difficulty: medium
    prompt: What is cross-site scripting (XSS) and how do you prevent it?
    reference_answer: XSS happens when an attacker gets their script to run in other users' browsers, usually by injecting HTML or JavaScript through user-controlled content that the site renders unescaped. It can steal sessions or act as the user. Prevent it by escaping output by default (as React does), never inserting untrusted HTML, sanitising rich text, using a Content Security Policy, and HttpOnly cookies so scripts can't read session tokens.
    key_points:
      - {id: kp1, text: "Attacker-controlled script runs in another user's browser", weight: 0.35}
      - {id: kp2, text: "Escape/encode output and avoid injecting untrusted HTML (sanitise)", weight: 0.4}
      - {id: kp3, text: "Defence in depth such as CSP or HttpOnly cookies", weight: 0.25}
    explanation: Output encoding is the primary defence.
