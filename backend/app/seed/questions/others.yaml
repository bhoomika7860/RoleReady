  - slug: sd-int1
    skill: system-design
    topic: Design
    type: short_answer
    difficulty: medium
    purpose: interview
    prompt: Design a URL shortener at a high level. What components would you need and how would you scale reads?
    reference_answer: An API to create short codes and a redirect endpoint. Generate unique codes with a base62 encoding of an ID or random strings with a collision check, and store the code-to-URL mapping in a database keyed by code. Redirects are read-heavy, so put a cache such as Redis in front of the database, use read replicas, and run stateless app servers behind a load balancer. Add rate limiting, analytics counters written asynchronously, and expiry for links.
    key_points:
      - {id: kp1, text: "Code generation strategy (base62 / random with collision check)", weight: 0.3}
      - {id: kp2, text: "Storage of code → URL mapping and redirect flow", weight: 0.25}
      - {id: kp3, text: "Scaling reads with caching / replicas / stateless servers", weight: 0.3}
      - {id: kp4, text: "Extras: rate limiting, analytics, expiry", weight: 0.15}
    explanation: Interviewers look for read-heavy scaling and a sound ID scheme.
